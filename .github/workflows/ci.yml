name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -race ./...
      - name: benchmarks compile and run
        run: go test -run='^$' -bench=. -benchtime=1x ./...
      - name: fuzz smoke
        run: |
          for spec in wire:FuzzPacket wire:FuzzFrames session:FuzzHandlePacket; do
            pkg=${spec%%:*} target=${spec##*:}
            # A fixed count, not a duration: time-based runs can end with a
            # spurious "context deadline exceeded" from the fuzzer's shutdown.
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=2000000x ./internal/$pkg
          done

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y iperf3
      - run: go build -o bin/ ./cmd/arc-client ./cmd/arc-relay
      - name: tunnel end to end in network namespaces
        run: sudo KEEP_LOGS=1 ./test/netns/e2e.sh bin
      - name: HTTPS front end to end in network namespaces
        if: success() || failure() # independent of e2e.sh's result
        run: sudo ./test/netns/front.sh bin
      - name: account isolation end to end in network namespaces
        if: success() || failure()
        run: sudo ./test/netns/accounts.sh bin

  degraded:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y iperf3 wireguard-tools
      - name: load netem
        run: |
          sudo modprobe sch_netem ||
            { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe sch_netem; } ||
            echo "netem unavailable; degraded.sh will skip"
      - run: go build -o bin/ ./cmd/arc-client ./cmd/arc-relay
      - name: debug
        run: |
          dpkg -l wireguard-tools | tail -1
          ls /etc/apparmor.d | grep -i wg || true
          sudo aa-status | grep -iw wg || true
          for f in $(grep -lr 'bin/wg' /etc/apparmor.d 2>/dev/null); do echo "== $f"; cat $f; done
          sudo ip link add wgt type wireguard
          d=$(mktemp -d); wg genkey > $d/k
          try() { echo "-- $1"; shift; if sudo bash -c "$*"; then echo ok; else echo failed; fi; }
          try "file in mktemp" "wg set wgt private-key $d/k"
          try "pipe to /dev/stdin" "cat $d/k | wg set wgt private-key /dev/stdin"
          try "process substitution" "wg set wgt private-key <(cat $d/k)"
          try "/etc/wireguard file" "mkdir -p /etc/wireguard && cp $d/k /etc/wireguard/t.key && wg set wgt private-key /etc/wireguard/t.key"
          try "wg setconf" "printf '[Interface]\nPrivateKey = %s\n' \$(cat $d/k) > $d/c.conf && wg setconf wgt $d/c.conf"
          try "setconf /dev/stdin" "printf '[Interface]\nPrivateKey = %s\n' \$(cat $d/k) | wg setconf wgt /dev/stdin"
          sudo dmesg | grep -i apparmor | tail -5


  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r spec/requirements.txt
      - name: fixtures are up to date
        run: python spec/generate_arc_fixtures.py --check

