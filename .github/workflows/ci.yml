name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: fuzz smoke
        run: |
          for spec in wire:FuzzPacket wire:FuzzFrames session:FuzzHandlePacket; do
            pkg=${spec%%:*} target=${spec##*:}
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=20s ./internal/$pkg
          done

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r spec/requirements.txt
      - name: fixtures are up to date
        run: python spec/generate_arc_fixtures.py --check
