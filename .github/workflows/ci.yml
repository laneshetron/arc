name: ci

on:
  pull_request:

# Throwaway: checks that TestFromFDRealTUN fails on macOS when each FromFD
# fix is removed. Not for merging.
jobs:
  macos-regress:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: each fix removed must fail the test
        run: |
          set -u
          check() {
            local label=$1 pattern=$2
            cp internal/tun/fd_darwin.go /tmp/fd_darwin.go.orig
            sed -i '' "$pattern" internal/tun/fd_darwin.go
            if cmp -s internal/tun/fd_darwin.go /tmp/fd_darwin.go.orig; then echo "::error::$label: sabotage did not apply"; exit 1; fi
            go test -c -race -o bin/tun.test ./internal/tun
            if sudo bin/tun.test -test.v -test.run 'FromFDRealTUN' -test.timeout 60s > /tmp/out.txt 2>&1; then
              cat /tmp/out.txt; echo "::error::$label: test passed without the fix"; exit 1
            fi
            echo "== $label: failed as expected"; grep -E 'fd_darwin_test|--- ' /tmp/out.txt
            cp /tmp/fd_darwin.go.orig internal/tun/fd_darwin.go
          }
          go test -c -race -o bin/tun.test ./internal/tun
          echo "== fixed"; sudo bin/tun.test -test.v -test.run 'FromFD' | grep -E -- '--- |^ok|FAIL'
          check "no nonblocking" 's/if err := unix.SetNonblock(fd, true); err != nil {/if err := error(nil); err != nil {/'
          check "no close-on-exec" 's/^	unix.CloseOnExec(fd)$/	_ = unix.CloseOnExec/'
          check "MTU 1280 instead of 0" 's/wgtun.CreateTUNFromFile(f, 0)/wgtun.CreateTUNFromFile(f, 1280)/'
